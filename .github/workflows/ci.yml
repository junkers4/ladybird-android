# Fast checks on every push and pull request: requirements traceability, all JVM/Python/JavaScript tests,
# and the Android app built and linted without the native engine.
# Verifies: QA-001, QA-002, BLD-007
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Requirements, tests, app build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Python dependencies
        run: python3 -m pip install pyyaml "ziglang==0.16.0"

      - name: Requirements traceability
        run: python3 tools/requirements/check_traceability.py --matrix traceability.md

      - name: Python tests (tools)
        run: python3 -m unittest -v $(find tools -name "test_*.py" | sort)

      - name: JavaScript tests (scriptlets)
        run: node --test tests/js/*.test.mjs

      - name: Kotlin tests, lint and app build without the engine
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -Pladybird.skipNative=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            traceability.md
            android/core/build/reports/tests
            android/app/build/reports
          if-no-files-found: ignore
